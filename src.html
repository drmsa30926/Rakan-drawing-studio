<title>Rakan's Drawing Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sniglet:wght@400;800&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: home = colored lesson cards; studio = full-height column (top bar, spoken hint, square paper, crayon toolbar). Single bright look on purpose: a kid's sky-and-paper desk. */
:root{
  --sky:#E3F1FA; --paper:#FFFFFF; --ink:#1F2A44; --ink-soft:#5B6785;
  --tangerine:#FF7A30; --leaf:#2FA866; --sun:#FFC93C; --line:#C9DCEA;
  --display:"Sniglet","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--tangerine);outline-offset:3px}
#app{height:100%}
section{height:100%;box-sizing:border-box}

/* HOME */
#home,#gallery{overflow-y:auto;padding-inline:16px;padding-block:20px 32px}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:800;font-size:clamp(28px,7vw,42px);line-height:1.05;margin:0;text-wrap:balance}
h1 span{color:var(--tangerine)}
h2{font-family:var(--display);font-size:22px;margin:0}
.stars{display:flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:8px 16px;font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--line)}
.stars svg{width:26px;height:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{background:var(--paper);border-radius:22px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--line);transition:transform .15s}
.card:active{transform:translateY(4px);box-shadow:0 1px 0 var(--line)}
.card svg{width:100%;aspect-ratio:1;display:block;border-radius:16px}
.card b{font-family:var(--display);font-size:19px;font-weight:400}
.card small{color:var(--ink-soft);font-weight:800;font-size:13px}
.done-badge{color:var(--leaf)!important}
.big-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.big{border-radius:22px;padding:18px 14px;font-family:var(--display);font-size:21px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 rgba(31,42,68,.18)}
.big svg{width:30px;height:30px;flex:none}
.big.free{background:var(--tangerine);color:#fff}
.big.gal{background:var(--leaf);color:#fff}

/* STUDIO + PAPER shared */
#studio,#paperMode{display:flex;flex-direction:column;gap:10px;padding-inline:16px;padding-block:12px}
.top{display:flex;align-items:center;gap:10px}
.round{width:52px;height:52px;border-radius:50%;background:var(--paper);display:grid;place-items:center;box-shadow:0 3px 0 var(--line);flex:none}
.round svg{width:26px;height:26px}
.round.off{opacity:.45}
.dots{flex:1;display:flex;justify-content:center;gap:7px;flex-wrap:wrap}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.now{background:var(--tangerine);transform:scale(1.3)}
.dot.ok{background:var(--leaf)}
.hint{background:var(--paper);border-radius:18px;padding:8px 14px;font-family:var(--display);font-size:clamp(18px,4.6vw,25px);min-height:1.3em;box-shadow:0 3px 0 var(--line);display:flex;align-items:center;justify-content:center;gap:12px;text-align:center}
.hint span{text-wrap:balance;min-width:0}
.ref{width:66px;height:66px;flex:none;border-radius:12px;overflow:hidden;position:relative}
.ref svg{width:100%;height:100%;display:block}
.ref[hidden]{display:none!important}
.stage,.pm-stage{flex:1;min-height:0;display:grid;place-items:center;position:relative}
.paper,.pm-card{position:relative;background:var(--paper);border-radius:20px;box-shadow:0 6px 0 var(--line);overflow:hidden}
.paper{touch-action:none}
.paper canvas{position:absolute;inset:0;width:100%;height:100%}
.pm-card{width:300px;height:300px;max-width:100%;display:grid;place-items:center}
.pm-card svg{width:100%;height:100%;display:block}
#burst{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-family:var(--display);font-size:clamp(34px,10vw,64px);color:var(--tangerine);opacity:0;transition:opacity .2s;text-shadow:0 3px 0 #fff}
#burst.show{opacity:1;animation:pop .9s ease}
@keyframes pop{0%{transform:scale(.4)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.tools{display:flex;flex-direction:column;gap:10px}
.swatches{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.sw{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18);border:4px solid var(--paper)}
.sw.sel{outline:4px solid var(--ink);outline-offset:1px}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.tg{display:flex;gap:8px}
.tool{width:52px;height:52px;border-radius:16px;background:var(--paper);display:grid;place-items:center;box-shadow:0 3px 0 var(--line)}
.tool svg{width:28px;height:28px}
.tool.sel{background:var(--ink);color:#fff;box-shadow:0 3px 0 #0d1426}
.tool[hidden]{display:none!important}
.size i{display:block;border-radius:50%;background:currentColor}
.next{height:52px;padding:0 22px;border-radius:16px;background:var(--leaf);color:#fff;font-family:var(--display);font-size:21px;box-shadow:0 4px 0 #1d7d49}
.next.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{transform:scale(1.08)}}
.pm-card .new{stroke-dasharray:1;stroke-dashoffset:1}
.pm-card .new.go{animation:drawin var(--dur,1.3s) ease-in-out forwards}
@keyframes drawin{to{stroke-dashoffset:0}}
.ready{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px;text-align:center}
.ready .kit{display:flex;gap:18px}
.ready .kit svg{width:72px;height:72px}
.ready p{margin:0;font-weight:800;color:var(--ink-soft);line-height:1.5;max-width:30ch}
.pm-bar{display:flex;gap:10px;align-items:center;justify-content:space-between}
.pm-bar .next{flex:1;max-width:260px}
.photo{height:52px;padding:0 18px;border-radius:16px;background:var(--paper);font-family:var(--display);font-size:18px;display:flex;align-items:center;gap:8px;box-shadow:0 3px 0 var(--line);cursor:pointer}
.photo svg{width:24px;height:24px}
.photo[hidden]{display:none!important}

/* CHOOSER */
#chooser{position:fixed;inset:0;background:rgba(31,42,68,.45);display:grid;place-items:end center;z-index:10;padding-inline:16px}
.sheet{background:var(--sky);width:100%;max-width:520px;border-radius:26px 26px 0 0;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet h2{text-align:center;font-size:26px}
.sheet .prev{width:150px;height:150px;margin:0 auto;border-radius:18px;overflow:hidden;box-shadow:0 4px 0 var(--line)}
.sheet .prev svg{width:100%;height:100%;display:block}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{border-radius:22px;padding:18px 10px;display:flex;flex-direction:column;align-items:center;gap:8px;font-family:var(--display);font-size:20px;box-shadow:0 5px 0 rgba(31,42,68,.18)}
.choice svg{width:54px;height:54px}
.c-screen{background:var(--tangerine);color:#fff}
.c-paper{background:var(--paper);color:var(--ink)}
.sheet .cancel{font-weight:800;color:var(--ink-soft);padding:8px}

.mode-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.mode{display:flex;background:var(--paper);border-radius:999px;padding:4px;box-shadow:0 3px 0 var(--line)}
.mode button{font-family:var(--display);font-size:18px;padding:8px 18px;border-radius:999px;color:var(--ink-soft)}
.mode button.on{background:var(--ink);color:#fff}
/* GALLERY */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.pic{position:relative;background:var(--paper);border-radius:18px;padding:8px;box-shadow:0 4px 0 var(--line)}
.pic img{display:block;width:100%;aspect-ratio:1;border-radius:12px;object-fit:cover}
.pic .x{position:absolute;top:-8px;right:-8px;width:36px;height:36px;border-radius:50%;background:var(--ink);color:#fff;font-weight:800;font-size:18px}
.pic.ask .x{background:#D9443A}
.empty{background:var(--paper);border-radius:20px;padding:28px 20px;text-align:center;color:var(--ink-soft);font-weight:800;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app">
  <section id="home">
    <div class="wrap">
      <div class="brand">
        <h1>Rakan's <span>Drawing</span> Studio</h1>
        <div class="stars" aria-label="Stars earned"><svg viewBox="0 0 24 24"><path fill="#FFC93C" stroke="#E0A400" stroke-width="1.5" stroke-linejoin="round" d="M12 2.5l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 17.2l-5.9 3.2 1.3-6.5L2.5 9.3l6.6-.8z"/></svg><span id="starCount">0</span></div>
      </div>
      <div class="big-row">
        <button class="big free" id="goFree"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8a2.1 2.1 0 0 0-3-3L5 16z"/><path d="M14 7l3 3"/></svg>Free draw</button>
        <button class="big gal" id="goGal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>My pictures</button>
      </div>
      <div class="mode-row"><h2>What do you want to draw?</h2>
        <div class="mode" role="group" aria-label="Drawing style"><button id="mPencil">Pencil</button><button id="mColor">Color</button></div></div>
      <div class="grid" id="lessonGrid"></div>
    </div>
  </section>

  <section id="studio" hidden>
    <div class="top">
      <button class="round" id="back" aria-label="Back home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="dots" id="dots"></div>
      <button class="round" id="speakBtn" aria-label="Say it again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    </div>
    <div class="hint"><div class="ref" id="ref" hidden></div><span id="hint">Trace the line</span></div>
    <div class="stage" id="stage">
      <div class="paper" id="paper">
        <canvas id="guide"></canvas>
        <canvas id="draw"></canvas>
        <div id="burst">Great job!</div>
      </div>
    </div>
    <div class="tools">
      <div class="swatches" id="swatches"></div>
      <div class="row">
        <div class="tg">
          <button class="tool sel" id="tPen" aria-label="Crayon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l4-1L19 8a2.1 2.1 0 0 0-3-3L5 16z"/></svg></button>
          <button class="tool" id="tFill" aria-label="Paint bucket"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M11 3l8 8-7 7-8-8z"/><path d="M4 10h15"/><path d="M20 15s2 2.6 2 4a2 2 0 0 1-4 0c0-1.4 2-4 2-4z"/></svg></button>
          <button class="tool" id="tErase" aria-label="Eraser"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3l5 5-11 11H5l-3-3z"/><path d="M9 10l5 5M10 21h11"/></svg></button>
          <button class="tool" id="tShade" hidden aria-label="Shadow brush"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16z" fill="currentColor"/></svg></button>
          <button class="tool" id="tLight" hidden aria-label="Light brush"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg></button>
          <button class="tool size" id="tSize" aria-label="Crayon size"><i id="sizeDot" style="width:14px;height:14px"></i></button>
        </div>
        <div class="tg">
          <button class="tool" id="tUndo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg></button>
          <button class="next" id="nextBtn">Next</button>
        </div>
      </div>
    </div>
  </section>

  <section id="paperMode" hidden>
    <div class="top">
      <button class="round" id="pmBack" aria-label="Back home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="dots" id="pmDots"></div>
      <button class="round" id="pmSpeak" aria-label="Say it again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg></button>
    </div>
    <div class="hint"><span id="pmHint">Get your paper ready</span></div>
    <div class="pm-stage" id="pmStage"><div class="pm-card" id="pmCard"></div></div>
    <div class="pm-bar">
      <button class="tool" id="pmPrev" aria-label="Previous step"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="tool" id="pmReplay" aria-label="Show me again"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg></button>
      <label class="photo" id="pmPhoto" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo<input type="file" id="photoIn" accept="image/*" capture="environment" hidden></label>
      <button class="next" id="pmNext">Let's go!</button>
    </div>
  </section>

  <div id="chooser" hidden>
    <div class="sheet" role="dialog" aria-labelledby="chTitle">
      <div class="prev" id="chPrev"></div>
      <h2 id="chTitle">Fish</h2>
      <div class="choice">
        <button class="c-screen" id="chScreen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2" width="14" height="20" rx="3"/><path d="M9 14l3-5 3 5"/></svg>On the screen</button>
        <button class="c-paper" id="chPaper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h9l4 4v16H6z"/><path d="M15 2v4h4"/><path d="M9 16l6-6 2 2-6 6H9z"/></svg>On paper</button>
      </div>
      <button class="cancel" id="chCancel">Cancel</button>
    </div>
  </div>

  <section id="gallery" hidden>
    <div class="wrap">
      <div class="brand">
        <button class="round" id="galBack" aria-label="Back home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <h1>My <span>pictures</span></h1>
        <span style="width:52px"></span>
      </div>
      <div class="gal-grid" id="galGrid"></div>
    </div>
  </section>
</div>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><path id="mp"/></svg>

<script>
(function(){
const $=id=>document.getElementById(id);
const INK='#1F2A44';

/* ---------- shape helpers (400 x 400 grid) ---------- */
const circ=(cx,cy,r)=>`M${cx-r} ${cy} A${r} ${r} 0 1 1 ${cx+r} ${cy} A${r} ${r} 0 1 1 ${cx-r} ${cy} Z`;
const ell=(cx,cy,rx,ry)=>`M${cx-rx} ${cy} A${rx} ${ry} 0 1 1 ${cx+rx} ${cy} A${rx} ${ry} 0 1 1 ${cx-rx} ${cy} Z`;
const wavy=(cx,cy,r,n,amp)=>{let s=`M${cx+r} ${cy}`;for(let i=0;i<n;i++){const a1=(i+.5)/n*2*Math.PI,a2=(i+1)/n*2*Math.PI;s+=` Q${(cx+(r+amp)*Math.cos(a1)).toFixed(1)} ${(cy+(r+amp)*Math.sin(a1)).toFixed(1)} ${(cx+r*Math.cos(a2)).toFixed(1)} ${(cy+r*Math.sin(a2)).toFixed(1)}`}return s+' Z'};
const star=(cx,cy,R,r)=>{let s='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r:R;s+=(i?' L':'M')+(cx+q*Math.cos(a)).toFixed(1)+' '+(cy+q*Math.sin(a)).toFixed(1)}return s+' Z'};
/* a part: d=path, f=fill, z=layer, w=stroke width (0 = none), s=stroke color, t=0 means "not traced" */
const eye=(cx,cy,r,z)=>[{d:circ(cx,cy,r),f:INK,z:z||9},{d:circ(cx+r*.35,cy-r*.38,r*.36),f:'#fff',w:0,z:(z||9)+.1,t:0}];
const blush=(cx,cy,r)=>({d:circ(cx,cy,r),f:'#F7A1A1',w:0,z:8,t:0});

/* ---------- LESSONS (realistic) ---------- */
/* extra helpers for realistic lessons */
const mirror=d=>d.replace(/(-?\d+\.?\d*)[ ,]+(-?\d+\.?\d*)/g,(m,x,y)=>`${+(400-x).toFixed(1)} ${y}`);
const rEye=(cx,cy,rx,ry,iris,z)=>{z=z||9;return[{d:`M${cx-rx} ${cy} Q${cx} ${cy-ry*1.7} ${cx+rx} ${cy} Q${cx} ${cy+ry*1.4} ${cx-rx} ${cy} Z`,f:iris,z,w:2.5,s:'#1B1410'},{d:circ(cx,cy,ry*.62),f:'#0E0B09',z:z+.1,w:0,t:0},{d:circ(cx-rx*.22,cy-ry*.32,ry*.26),f:'#FFFFFF',w:0,z:z+.2,t:0}]};
const tufts=(cx,cy,rx,ry,n,amp)=>{let s=`M${cx+rx} ${cy}`;for(let i=0;i<n;i++){const a1=(i+.5)/n*2*Math.PI,a2=(i+1)/n*2*Math.PI,k=1+amp*(.55+.45*((i*5)%3)/2);s+=` Q${(cx+rx*k*Math.cos(a1)).toFixed(1)} ${(cy+ry*k*Math.sin(a1)).toFixed(1)} ${(cx+rx*Math.cos(a2)).toFixed(1)} ${(cy+ry*Math.sin(a2)).toFixed(1)}`}return s+' Z'};
const spokes=(cx,cy,r)=>[0,1,2,3,4].map(i=>{const a=-Math.PI/2+i*2*Math.PI/5;return{d:`M${cx} ${cy} L${(cx+r*Math.cos(a)).toFixed(1)} ${(cy+r*Math.sin(a)).toFixed(1)}`,w:4,s:'#6E7684',z:4.2,t:0}});
const both=(p)=>[p,Object.assign({},p,{d:mirror(p.d)})];

const LION_FACE='M200 112 Q250 114 268 150 Q282 185 272 222 Q262 262 236 290 Q220 306 200 308 Q180 306 164 290 Q138 262 128 222 Q118 185 132 150 Q150 114 200 112 Z';
const PANDA_HEAD='M200 112 Q262 112 288 160 Q306 200 294 240 Q278 288 232 304 Q200 312 168 304 Q122 288 106 240 Q94 200 112 160 Q138 112 200 112 Z';
const BEAR_HEAD='M200 116 Q256 114 282 156 Q300 192 288 230 Q278 258 252 274 L148 274 Q122 258 112 230 Q100 192 118 156 Q144 114 200 116 Z';
const CAR_BODY='M40 262 Q40 240 60 232 Q110 218 150 212 Q190 178 236 172 Q280 170 306 196 Q340 204 360 216 Q372 226 370 248 L368 262 Q366 270 356 270 L48 270 Q40 270 40 262 Z';

const LESSONS=[
{id:'lion',name:'Lion',bg:'#F1E3C8',tex:{fur:[0,1,2,6]},steps:[
 {say:'Draw the head shape',talk:"Hello Rakan! Today we will draw a real lion. First, the head. Start at the top, go wide for the cheeks, and get narrow at the chin, like a big shield.",parts:[{d:LION_FACE,f:'#C8964F',z:3}]},
 {say:'Draw the big mane',talk:"Now the mane. It's the long hair around the head. Draw a big bumpy shape all around the face. Make it big, lions have lots of hair!",parts:[{d:tufts(200,214,152,150,22,.13),f:'#7A4A22',z:0}]},

function toGray(c){
  if(!c||c==='none'||c.startsWith('url'))return c;

  if(m){let h=m[1];if(h.length===3)h=h.split('').map(x=>x+x).join('');const n=parseInt(h,16),v=Math.round(.3*(n>>16&255)+.59*(n>>8&255)+.11*(n&255));const q=v.toString(16).padStart(2,'0');return'#'+q+q+q}

}

  const items=stage===0?allParts(l):allParts(l).concat((l.shade||[]).filter(q=>stage>=q.stage));
  for(const p of byZ(items)){
    if(stage===0){if(p.t===0)continue;g+=`<path d="${p.d}" fill="${p.f?'#fff':'none'}" stroke="#6A6F7A" stroke-width="${p.w===0?2:Math.min(p.w,3)}"/>`;continue}
    if(p.si===-1){g+=`<path d="${p.d}" fill="${G(p.f||'none')}" stroke="${p.s?G(p.s):'none'}" stroke-width="${p.w||0}"/>`;continue}
    const filled=p.f&&p.t!==0;
    if(p.f)g+=`<path d="${p.d}" fill="${G(p.f)}"/>`;
    if(filled){
      const tx=stage>=4&&texFor(l,p);if(tx)g+=`<path d="${p.d}" fill="url(#tx-${tx})"/>`;
      if(stage>=2)g+=`<path d="${p.d}" fill="url(#sh)"/>`;
      if(stage>=3)g+=`<path d="${p.d}" fill="url(#hl)"/>`;
    }
    if(p.w!==0){
      const line=p.s||(p.f&&/^#/.test(p.f)&&p.f!==INK&&p.f.toLowerCase()!=='#fff'&&p.f.toLowerCase()!=='#ffffff'?darken(p.f,.5):(p.f?'#7B8494':'#2A2420'));
      const lw=p.f?Math.min(p.w,2.5):p.w;

}

function ding(big){
  if(!actx)return;
  try{const notes=big?[523,659,784,1047]:[659,988];notes.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type='triangle';o.frequency.value=f;const t=actx.currentTime+i*.11;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.35);o.connect(g).connect(actx.destination);o.start(t);o.stop(t+.4)})}catch(e){}
}
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
    const pref=[/Google US English/i,/Samantha/i,/Ava|Allison|Susan/i,/Jenny|Aria|Ana/i,/en-us-x-.*-network/i,/Google UK English Female/i,/Karen|Moira|Tessa|Serena/i];
    for(const p of pref){const v=vs.find(v=>p.test(v.name)||p.test(v.voiceURI||''));if(v){voice=v;return}}
    voice=vs.find(v=>/en[-_]US/i.test(v.lang))||vs[0]||null;
  }catch(e){}
}
try{speechSynthesis.onvoiceschanged=pickVoice;pickVoice()}catch(e){}

  if(!voiceOn){onstart&&onstart();return}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    if(voice)u.voice=voice;u.lang=voice?voice.lang:'en-US';u.rate=.86;u.pitch=1.12;
    let fired=false;const go=()=>{if(!fired){fired=true;onstart&&onstart()}};

}

    const path=new Path2D(p.d);
    if(p.f){dctx.fillStyle='#FFFFFF';dctx.fill(path)}
    if(p.w!==0){dctx.strokeStyle='#4A4F5C';dctx.lineWidth=p.f?3.5:Math.min(p.w,5);dctx.stroke(path)}
    else if(p.f&&p.t!==0){dctx.strokeStyle='#4A4F5C';dctx.lineWidth=2.5;dctx.stroke(path)}
  }
  dctx.restore();
  cs=0;colorStep();redrawGuide();
}
function colorStep(){
  const st=SH()[cs];
  $('ref').innerHTML=artSVG(lesson,cs+1);$('ref').hidden=false;
  $('tFill').hidden=false;$('tShade').hidden=cs<1;$('tLight').hidden=cs<2;
  if(cs===0){setTool('fill');color=MODE==='pencil'?GREYS[3]:COLORS[3]}else if(cs===1)setTool('shade');else if(cs===2)setTool('light');else{setTool('pen');sizeI=0;color=MODE==='pencil'?'#3A3A3A':'#6B4423';$('sizeDot').style.width='8px';$('sizeDot').style.height='8px'}
  buildSwatches();
  $('hint').textContent=st.say;
  const extra=cs===0?" Look at the little picture. Pick a color, then tap inside a shape to paint it.":cs===1?" Use the shadow brush, the half black circle.":cs===2?" Use the light brush, the little sun.":"";
  say((cs===3?finalTalk(lesson):st.talk)+extra);
  $('nextBtn').textContent=cs<3?'Next':'Done';$('nextBtn').classList.remove('glow');
  renderDots();
}
function renderDots(){
  if(!lesson){$('dots').innerHTML='';return}
  const n=lesson.steps.length+4;let h='';
  const cur=phase==='color'?lesson.steps.length+cs:phase==='finished'?n:step;
  for(let i=0;i<n;i++)h+=`<span class="dot ${i<cur||phase==='finished'?'ok':i===cur?'now':''}"></span>`;
  $('dots').innerHTML=h;
}
$('speakBtn').onclick=()=>{
  unlockAudio();
  if(lesson&&phase==='trace'){const s=lesson.steps[step];demo={start:0,parts:s.parts.filter(p=>p.t!==0).map(p=>partPts(p.d))};say(s.talk,()=>{if(demo)demo.start=performance.now()})}
  else say($('hint').textContent);
};
$('speakBtn').addEventListener('dblclick',()=>{voiceOn=!voiceOn;$('speakBtn').classList.toggle('off',!voiceOn);$('pmSpeak').classList.toggle('off',!voiceOn)});
$('nextBtn').onclick=()=>{
  unlockAudio();
  if(!lesson){saveDrawing();celebrate('Saved!');say('Saved! Look in My pictures.');return}
  if(phase==='trace'){
    if(step<lesson.steps.length-1){step++;startStep()}else startColoring();
  }else if(phase==='color'&&cs<3){cs++;colorStep();
  }else if(phase==='color'){
    saveDrawing();
    if(!doneSet[lesson.id]){doneSet[lesson.id]=1;store.set('rk_done',doneSet)}
    stars+=3;store.set('rk_stars',stars);
    celebrate('★ ★ ★');say('Amazing, Rakan! You drew the '+lesson.name+'! You got three stars!');
    phase='finished';$('nextBtn').textContent='Home';renderDots();
  }else{goHome()}
};
$('back').onclick=goHome;
function goHome(){cancelAnimationFrame(raf);hush();demo=null;renderHome();show('home')}

/* ---------- GUIDE LAYER ---------- */
function redrawGuide(now){
  gctx.setTransform(1,0,0,1,0,0);gctx.clearRect(0,0,guide.width,guide.height);
  if(!lesson||phase!=='trace')return;
  gctx.setTransform(dpr*k,0,0,dpr*k,0,0);
  gctx.lineCap='round';gctx.lineJoin='round';gctx.setLineDash([]);
  // earlier steps: soft grey, layered so hidden lines disappear
  for(const p of byZ(allParts(lesson).filter(p=>p.si<step))){
    const path=new Path2D(p.d);
    if(p.f){gctx.fillStyle='#F4F7FA';gctx.fill(path)}
    if(p.w!==0){gctx.strokeStyle='#C8D3DF';gctx.lineWidth=Math.min(p.w,6);gctx.stroke(path)}
  }
  const s=lesson.steps[step],cur=s.parts.filter(p=>p.t!==0);
  // "watch me" pencil demo
  if(demo&&!stepOk){
    const t=demo.start?(now-demo.start)/1000:0;
    const per=Math.max(.6,Math.min(1.4,4.5/demo.parts.length));
    let pencil=null;
    cur.forEach((p,i)=>{
      const prog=Math.max(0,Math.min(1,(t-i*per)/per));
      if(prog<=0)return;
      const L=demo.parts[i].len;
      gctx.strokeStyle='#FF7A30';gctx.lineWidth=6;gctx.setLineDash([L*prog,L+10]);gctx.lineDashOffset=0;
      gctx.stroke(new Path2D(p.d));gctx.setLineDash([]);
      if(prog<1){const pts=demo.parts[i].pts;pencil=pts[Math.min(pts.length-1,Math.floor(prog*(pts.length-1)))]}
    });
    if(pencil){gctx.fillStyle='#FF7A30';gctx.beginPath();gctx.arc(pencil[0],pencil[1],10,0,7);gctx.fill();gctx.fillStyle='#fff';gctx.beginPath();gctx.arc(pencil[0],pencil[1],4,0,7);gctx.fill()}
    if(demo.start&&t>cur.length*per+.6)demo=null;
    return;
  }
  // tracing guide: soft band + marching dashes + green start dots
  gctx.strokeStyle=stepOk?'rgba(47,168,102,.25)':'rgba(255,122,48,.18)';gctx.lineWidth=26;
  cur.forEach(p=>gctx.stroke(new Path2D(p.d)));
  gctx.strokeStyle=stepOk?'#2FA866':'#FF7A30';gctx.lineWidth=5;gctx.setLineDash([14,12]);gctx.lineDashOffset=-dashT;
  cur.forEach(p=>gctx.stroke(new Path2D(p.d)));
  gctx.setLineDash([]);
  if(!stepOk){const mp=$('mp');cur.forEach(p=>{mp.setAttribute('d',p.d);const q=mp.getPointAtLength(0);gctx.fillStyle='#2FA866';gctx.beginPath();gctx.arc(q.x,q.y,9,0,7);gctx.fill();gctx.fillStyle='#fff';gctx.beginPath();gctx.arc(q.x,q.y,3.5,0,7);gctx.fill()})}
}
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(){cancelAnimationFrame(raf);const f=n=>{if(phase==='trace'&&(demo||(!reduce&&!stepOk))){if(!demo)dashT=(dashT+.6)%26;redrawGuide(n)}raf=requestAnimationFrame(f)};raf=requestAnimationFrame(f)}

/* ---------- DRAWING ---------- */
let drawing=false,last=null,mid=null;
const brushCol=()=>tool==='shade'?'rgba(25,20,45,.13)':tool==='light'?'rgba(255,255,255,.4)':color;
const brushW=()=>tool==='shade'?28:tool==='light'?22:SIZES[sizeI]*(tool==='erase'?2:1);
function pos(e){const r=draw.getBoundingClientRect();return[(e.clientX-r.left)*(S/r.width),(e.clientY-r.top)*(S/r.height)]}
draw.addEventListener('pointerdown',e=>{
  unlockAudio();e.preventDefault();
  if(phase==='finished')return;
  if(demo){demo=null;redrawGuide()}
  const p=pos(e);
  if(tool==='fill'){pushUndo();floodFill(Math.floor(p[0]*dpr),Math.floor(p[1]*dpr),color);ding(false);return}
  draw.setPointerCapture(e.pointerId);pushUndo();
  drawing=true;last=p;mid=p;
  dctx.setTransform(dpr,0,0,dpr,0,0);
  dctx.globalCompositeOperation=tool==='erase'?'destination-out':'source-over';
  dctx.fillStyle=brushCol();dctx.beginPath();dctx.arc(p[0],p[1],brushW()/2,0,7);dctx.fill();
});
draw.addEventListener('pointermove',e=>{
  if(!drawing)return;
  const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
  dctx.strokeStyle=brushCol();dctx.lineWidth=brushW();dctx.lineCap='round';dctx.lineJoin='round';
  for(const ev of evs){const p=pos(ev);const m=[(last[0]+p[0])/2,(last[1]+p[1])/2];
    dctx.beginPath();dctx.moveTo(mid[0],mid[1]);dctx.quadraticCurveTo(last[0],last[1],m[0],m[1]);dctx.stroke();last=p;mid=m}
});
function endStroke(){
  if(!drawing)return;drawing=false;
  dctx.globalCompositeOperation='source-over';dctx.setTransform(1,0,0,1,0,0);
  if(phase==='trace'&&!stepOk)checkTrace();
}
draw.addEventListener('pointerup',endStroke);draw.addEventListener('pointercancel',endStroke);

function checkTrace(){
  if(!samples.length)return;
  const w=draw.width,h=draw.height;let data;
  try{data=dctx.getImageData(0,0,w,h).data}catch(e){return}
  const R=Math.round(15*dpr),st=Math.max(2,Math.round(3*dpr));let hit=0;
  for(const [x,y] of samples){
    const cx=Math.round(x*k*dpr),cy=Math.round(y*k*dpr);let ok=false;
    for(let dy=-R;dy<=R&&!ok;dy+=st)for(let dx=-R;dx<=R;dx+=st){const px=cx+dx,py=cy+dy;if(px<0||py<0||px>=w||py>=h)continue;if(data[(py*w+px)*4+3]>40){ok=true;break}}
    if(ok)hit++;
  }
  if(hit/samples.length>=.7){
    stepOk=true;redrawGuide();ding(false);
    const praise=['Great job!','Super!','Well done!','Wow!','Awesome!','Perfect!'][Math.floor(Math.random()*6)];
    celebrate(praise);say(praise+(step<lesson.steps.length-1?' Tap next!':' Now tap next to color it!'));
    $('dots').children[step]&&$('dots').children[step].classList.add('ok');
    $('nextBtn').classList.add('glow');
  }
}
let burstT;
function celebrate(t){const b=$('burst');b.textContent=t;b.classList.remove('show');void b.offsetWidth;b.classList.add('show');ding(true);clearTimeout(burstT);burstT=setTimeout(()=>b.classList.remove('show'),1300)}

/* ---------- PAINT BUCKET ---------- */
function hexRgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255]}
function floodFill(x,y,hex){
  const w=draw.width,h=draw.height;if(x<0||y<0||x>=w||y>=h)return;
  const img=dctx.getImageData(0,0,w,h),d=img.data,[r,g,b]=hexRgb(hex);
  const i0=(y*w+x)*4,t=[d[i0],d[i0+1],d[i0+2],d[i0+3]];
  if(t[3]>250&&Math.abs(t[0]-r)+Math.abs(t[1]-g)+Math.abs(t[2]-b)<10)return;
  const tol=90,match=i=>Math.abs(d[i]-t[0])+Math.abs(d[i+1]-t[1])+Math.abs(d[i+2]-t[2])+Math.abs(d[i+3]-t[3])*2<=tol;
  const seen=new Uint8Array(w*h),filled=new Uint8Array(w*h),stack=[y*w+x];
  while(stack.length){
    const p=stack.pop();if(seen[p])continue;seen[p]=1;const i=p*4;if(!match(i))continue;
    d[i]=r;d[i+1]=g;d[i+2]=b;d[i+3]=255;filled[p]=1;
    const px=p%w;if(px>0)stack.push(p-1);if(px<w-1)stack.push(p+1);if(p>=w)stack.push(p-w);if(p<w*(h-1))stack.push(p+w);
  }
  for(let pass=0;pass<2;pass++){
    const add=[];
    for(let p=0;p<w*h;p++){if(filled[p])continue;const i=p*4;if(d[i+3]>=230&&!(d[i]>200&&d[i+1]>200&&d[i+2]>200&&!match(i)))continue;
      if(d[i+3]>=230)continue;const px=p%w;
      if((px>0&&filled[p-1])||(px<w-1&&filled[p+1])||(p>=w&&filled[p-w])||(p<w*(h-1)&&filled[p+w]))add.push(p)}
    for(const p of add){const i=p*4,a=d[i+3]/255;d[i]=Math.round(d[i]*a+r*(1-a));d[i+1]=Math.round(d[i+1]*a+g*(1-a));d[i+2]=Math.round(d[i+2]*a+b*(1-a));d[i+3]=255;filled[p]=1}
  }
  dctx.putImageData(img,0,0);
}

/* ---------- PAPER MODE ---------- */
let pmL=null,pmI=0; /* 0 = get ready, 1..n = steps, n+1 = color it, n+2 = finished */
const KIT=`<div class="ready"><div class="kit">
 <svg viewBox="0 0 64 64"><rect x="12" y="6" width="40" height="52" rx="4" fill="#fff" stroke="#1F2A44" stroke-width="3"/><path d="M20 20h24M20 30h24M20 40h16" stroke="#C9DCEA" stroke-width="3" stroke-linecap="round"/></svg>
 <svg viewBox="0 0 64 64"><path d="M14 50l6-18 26-26 12 12-26 26z" fill="#FFC93C" stroke="#1F2A44" stroke-width="3" stroke-linejoin="round"/><path d="M14 50l6-18 12 12z" fill="#F5D7B5" stroke="#1F2A44" stroke-width="3" stroke-linejoin="round"/><path d="M14 50l2.5-7.5 5 5z" fill="#1F2A44"/></svg>
 <svg viewBox="0 0 64 64"><rect x="8" y="22" width="12" height="34" rx="3" fill="#E8423A" stroke="#1F2A44" stroke-width="3"/><rect x="26" y="16" width="12" height="40" rx="3" fill="#2C8CE8" stroke="#1F2A44" stroke-width="3"/><rect x="44" y="22" width="12" height="34" rx="3" fill="#2FA866" stroke="#1F2A44" stroke-width="3"/></svg>
</div><p>Get a paper, a pencil and your crayons. Draw big!</p></div>`;
function fitPM(){
  const st=$('pmStage').getBoundingClientRect();
  const s=Math.max(200,Math.floor(Math.min(st.width,st.height,640)));
  $('pmCard').style.width=s+'px';$('pmCard').style.height=s+'px';
}
function openPaper(l){pmL=l;pmI=0;show('paperMode');fitPM();renderPM()}
function pmText(i){
  const n=pmL.steps.length;
  if(i===0)return{say:'Get your paper ready',talk:"Let's draw a "+pmL.name+" on paper! Get a paper, a pencil, and your crayons. Draw nice and big! Tap the green button when you are ready."};
  if(i<=n){const s=pmL.steps[i-1];return{say:s.say,talk:s.talk+" Watch me, then draw it on your paper. Tap I drew it when you finish."}}
  if(i>n&&i<=n+4){const c=i-n-1,st=SH()[c];return{say:st.say,talk:(c===3?finalTalk(pmL):st.talk+(c===0?" Use your colored pencils. Take your time!":""))}}
  return{say:'You did it!',talk:"You did it, Rakan! Amazing! Three stars for you! Take a photo of your drawing to keep it."};
}
function renderPM(){
  const n=pmL.steps.length,card=$('pmCard');
  let h='';for(let i=1;i<=n+4;i++)h+=`<span class="dot ${i<pmI?'ok':i===pmI?'now':''}"></span>`;
  $('pmDots').innerHTML=pmI===0?'':h;
  const tx=pmText(pmI);$('pmHint').textContent=tx.say;
  $('pmPrev').style.visibility=pmI>0?'visible':'hidden';
  $('pmReplay').hidden=!(pmI>=1&&pmI<=n);
  $('pmPhoto').hidden=pmI<n+4;
  $('pmNext').textContent=pmI===0?"I'm ready!":pmI<=n?'I drew it!':pmI<n+4?'I did it!':pmI===n+4?'I finished!':'Home';
  $('pmNext').classList.toggle('glow',pmI>=n+4);
  if(pmI===0){card.innerHTML=KIT;say(tx.talk);return}
  if(pmI>n){card.innerHTML=artSVG(pmL,Math.min(4,pmI-n));say(tx.talk);return}
  const si=pmI-1;let g='';
  for(const p of byZ(allParts(pmL).filter(p=>p.si<=si))){
    if(p.si<si){
      g+=`<path d="${p.d}" fill="${p.f?'#F4F7FA':'none'}" stroke="${p.w===0?'none':'#C3CEDB'}" stroke-width="${Math.min(p.w,6)}"/>`;
    }
  }
  const cur=pmL.steps[si].parts.filter(p=>p.t!==0);
  const per=Math.max(.6,Math.min(1.4,4.5/cur.length));
  cur.forEach((p,j)=>{g+=`<path class="new" pathLength="1" d="${p.d}" fill="none" stroke="#FF7A30" stroke-width="7" style="animation-delay:${(j*per).toFixed(2)}s;--dur:${per.toFixed(2)}s"/>`});
  card.innerHTML=`<svg viewBox="0 0 400 400"><rect width="400" height="400" fill="#fff"/><g stroke-linecap="round" stroke-linejoin="round">${g}</g></svg>`;
  say(tx.talk,animatePM);
}
function animatePM(){
  const ps=$('pmCard').querySelectorAll('.new');
  if(reduce){ps.forEach(p=>p.style.strokeDashoffset=0);return}
  ps.forEach(p=>{p.classList.remove('go');void p.getBoundingClientRect();p.classList.add('go')});
}
$('pmReplay').onclick=()=>{unlockAudio();const ps=$('pmCard').querySelectorAll('.new');ps.forEach(p=>p.classList.remove('go'));say(pmText(pmI).talk,animatePM)};
$('pmSpeak').onclick=()=>{unlockAudio();say(pmText(pmI).talk)};
$('pmSpeak').addEventListener('dblclick',()=>{voiceOn=!voiceOn;$('speakBtn').classList.toggle('off',!voiceOn);$('pmSpeak').classList.toggle('off',!voiceOn)});
$('pmPrev').onclick=()=>{if(pmI>0){pmI--;renderPM()}};
$('pmBack').onclick=goHome;
$('pmNext').onclick=()=>{
  unlockAudio();const n=pmL.steps.length;
  if(pmI>=1&&pmI<=n)ding(false);
  if(pmI===n+4){if(!doneSet[pmL.id]){doneSet[pmL.id]=1;store.set('rk_done',doneSet)}stars+=3;store.set('rk_stars',stars);ding(true)}
  if(pmI>n+4){goHome();return}
  pmI++;renderPM();
};
$('photoIn').onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const im=new Image();im.onload=()=>{
    const c=document.createElement('canvas');c.width=360;c.height=360;const x=c.getContext('2d');
    const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,360,360);
    const pics=store.get('rk_pics',[]);pics.unshift({src:c.toDataURL('image/jpeg',.8),t:Date.now()});
    while(pics.length&&!store.set('rk_pics',pics.slice(0,24)))pics.pop();
    $('pmHint').textContent='Photo saved in My pictures!';say('Photo saved! Great drawing!');ding(true);
  };im.src=r.result};
  r.readAsDataURL(f);e.target.value='';
};

/* ---------- GALLERY ---------- */
function saveDrawing(){
  const c=document.createElement('canvas');c.width=360;c.height=360;const x=c.getContext('2d');
  x.fillStyle='#fff';x.fillRect(0,0,360,360);x.drawImage(draw,0,0,360,360);
  const pics=store.get('rk_pics',[]);pics.unshift({src:c.toDataURL('image/jpeg',.82),t:Date.now()});
  while(pics.length&&!store.set('rk_pics',pics.slice(0,24)))pics.pop();
}
function renderGallery(){
  const pics=store.get('rk_pics',[]);
  $('galGrid').innerHTML=pics.length?pics.map((p,i)=>`<div class="pic" data-i="${i}"><img src="${p.src}" alt="Drawing ${i+1}"><button class="x" aria-label="Delete">✕</button></div>`).join('')
    :'<div class="empty">No pictures yet.<br>Finish a drawing, or take a photo of your paper, and it shows up here.</div>';
  $('galGrid').querySelectorAll('.pic').forEach(el=>{
    el.querySelector('.x').onclick=()=>{
      if(!el.classList.contains('ask')){el.classList.add('ask');el.querySelector('.x').textContent='?';setTimeout(()=>{el.classList.remove('ask');el.querySelector('.x').textContent='✕'},2500);return}
      const arr=store.get('rk_pics',[]);arr.splice(+el.dataset.i,1);store.set('rk_pics',arr);renderGallery();
    };
  });
}
$('goGal').onclick=()=>{renderGallery();show('gallery')};
$('galBack').onclick=goHome;
$('goFree').onclick=()=>{unlockAudio();openFree()};
